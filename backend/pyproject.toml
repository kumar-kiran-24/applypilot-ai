[project]
name = "applypilot-backend"
version = "0.1.0"
description = "ApplyPilot AI - Your Intelligent Job Application Agent (backend)"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "C4", "RUF"]
ignore = [
    "B008",  # FastAPI dependencies are declared as function-call defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: calls a real external API (skipped when credentials are absent)",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
