# ApplyPilot AI - Nginx site configuration (Ubuntu)
#
# Install to /etc/nginx/sites-available/applypilot.conf, then:
#   ln -s /etc/nginx/sites-available/applypilot.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Replace __DOMAIN__ and __MONITORING_CIDR__ (the installer does this). The
# certificate paths come from `certbot certonly --webroot` (see
# deploy/scripts/install.sh); renewal is handled by certbot.timer + the deploy
# hook that reloads Nginx.

limit_req_zone $binary_remote_addr zone=ap_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ap_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ap_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Privacy-preserving access log ------------------------------------------
# `$uri` is the normalized request path WITHOUT the query string, so one-time
# browser-view tickets (?ticket=...), OAuth authorization codes and any other
# token carried in a query parameter can never be written to disk. `$request`
# and `$request_uri` must never be used in this format for that reason.
# $request_id is the correlation id also sent to FastAPI as X-Request-ID, so a
# log line can be tied to an application log line without logging input.
log_format applypilot '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time '
                      'rid=$request_id';

access_log /var/log/nginx/applypilot.access.log applypilot;

upstream applypilot_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream applypilot_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/applypilot.access.log applypilot;

    # ACME HTTP-01 challenge only; everything else is HTTPS. Certbot renews with
    # the webroot authenticator, so renewal never needs to stop Nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line works on Ubuntu 22.04 (nginx 1.18) and 24.04
    # (1.24); the newer standalone `http2 on;` directive is not available there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;

    access_log /var/log/nginx/applypilot.access.log applypilot;

    # --- Security headers: emitted exactly once ------------------------------
    # Nginx owns these headers: it sets them for proxied responses AND for
    # responses it generates itself (redirects, 404s), which FastAPI/Next can
    # never do. The upstream copies are stripped with proxy_hide_header below,
    # so a client never receives two values for the same header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Content-Security-Policy is intentionally NOT set here: the API and the
    # Next.js pages need different policies, so each upstream owns its own and
    # it is passed through untouched (single value, no duplication).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;

    # Never expose the API schema, even if the backend is misconfigured.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Prometheus scrapes this over the private network with a bearer token
    # (METRICS_TOKEN). It is never reachable from the public internet: requests
    # from anywhere else are rejected by Nginx with 403 before reaching FastAPI.
    location = /api/v1/metrics {
        access_log /var/log/nginx/applypilot.access.log applypilot;
        allow 127.0.0.1;
        allow ::1;
        allow __MONITORING_CIDR__;
        deny all;
        proxy_pass http://applypilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    # Live browser view: long-lived WebSocket, no buffering, no request-body
    # limits that would break large frames. The one-time ticket travels in the
    # query string by design and is excluded from the access log (see $uri).
    location = /api/v1/browser-sessions/view/ws {
        proxy_pass http://applypilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    # Stricter edge limit on the public login flow, in addition to the backend's
    # per-address limiter.
    location /api/v1/auth/ {
        limit_req zone=ap_auth burst=10 nodelay;
        limit_conn ap_conn 20;
        proxy_pass http://applypilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=ap_api burst=40 nodelay;
        limit_conn ap_conn 20;
        proxy_pass http://applypilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Immutable hashed assets. `expires` (not add_header) keeps the server-level
    # security headers inherited.
    location /_next/static/ {
        proxy_pass http://applypilot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
    }

    location / {
        proxy_pass http://applypilot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
